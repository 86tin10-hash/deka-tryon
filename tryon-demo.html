<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>バーチャル試着 v5</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e0e10;color:#eee;font-family:-apple-system,"Hiragino Sans",sans-serif}
body{display:grid;grid-template-columns:210px 1fr;height:100vh;height:100dvh}
aside{background:#17171b;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:9px}
aside h3{margin:6px 0 0;font-size:13px;opacity:.7;font-weight:600}
#list{display:flex;flex-direction:column;gap:10px}
.prod{background:#f1f1f3;border-radius:10px;padding:6px;cursor:grab;user-select:none;touch-action:none;border:3px solid transparent}
.prod img{width:100%;display:block;pointer-events:none}
.prod span{display:block;font-size:12px;margin-top:4px;pointer-events:none;color:#222;font-weight:600}
.prod.on{border-color:#ff3d7f}
.btn{background:#2c2c36;color:#fff;border:0;border-radius:8px;padding:9px;font-size:13px;cursor:pointer;text-align:center}
.btn.ai{background:#5b3df5}
.btn input{display:none}
label.small{font-size:12px;display:block}
label.small input[type=range],select{width:100%}
select{background:#2c2c36;color:#fff;border:0;border-radius:6px;padding:6px}
main{position:relative;overflow:hidden;background:#000}
#banner{position:absolute;top:0;left:0;right:0;z-index:3;text-align:center;padding:12px 10px 24px;font-size:16px;font-weight:700;background:linear-gradient(#000c,#0000);pointer-events:none}
#stage{position:absolute;inset:0}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#v{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#msg{position:absolute;left:12px;bottom:12px;z-index:3;background:rgba(0,0,0,.7);padding:8px 12px;border-radius:8px;font-size:13px;max-width:78%;line-height:1.5}
#msg.err{background:#7a1020}
#fps{position:absolute;right:10px;bottom:10px;z-index:3;font-size:11px;opacity:.6}
#start{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0e0e10;padding:20px;text-align:center}
#start button{background:#ff3d7f;color:#fff;border:0;border-radius:12px;padding:16px 28px;font-size:18px;font-weight:700;cursor:pointer}
#start p{margin:0;opacity:.7;font-size:13px;line-height:1.7}
#ghost{position:fixed;z-index:10;width:90px;pointer-events:none;opacity:.85;transform:translate(-50%,-50%)}
main.over{box-shadow:inset 0 0 0 4px #ff3d7f}
#aiView{position:absolute;inset:0;z-index:6;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#aiView img{max-width:100%;max-height:80%;border-radius:8px}
@media (max-width:760px){
  body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{flex-direction:row;overflow-x:auto;overflow-y:hidden;align-items:center}
  #list{flex-direction:row}
  .prod{width:88px;flex:0 0 auto}
  aside h3,aside label.small{display:none}
}
</style>
</head>
<body>
<aside>
  <h3>商品（ドラッグ または タップ）</h3>
  <div id="list"></div>
  <label class="btn">+ 自分の服の画像<input id="file" type="file" accept="image/*"></label>
  <label class="small"><input type="checkbox" id="autoBg" checked> 背景を自動で消す</label>
  <label class="small">背景の消し具合<input id="tol" type="range" min="10" max="120" value="55"></label>

  <h3>フィット</h3>
  <label class="small">大きさ<input id="size" type="range" min="70" max="150" value="100"></label>
  <label class="small"><input type="checkbox" id="useMask" checked> 体の輪郭に合わせる（はみ出しを消す）</label>
  <label class="small">シワ・陰影（実際の体から）<input id="shade" type="range" min="0" max="100" value="15"></label>
  <label class="small">シルエット
    <select id="fitStyle">
      <option value="1.0">タイト</option>
      <option value="1.12" selected>レギュラー</option>
      <option value="1.26">オーバーサイズ</option>
    </select>
  </label>
  <label class="small"><input type="checkbox" id="matchLight" checked> 部屋の明るさ・色味に合わせる</label>
  <label class="small"><input type="checkbox" id="hands" checked> 手を服の手前に出す</label>
  <label class="small">認識の精度
    <select id="model">
      <option value="lite">軽い（iPad向け）</option>
      <option value="full" selected>標準</option>
      <option value="heavy">高精度（PC向け・重い）</option>
    </select>
  </label>
  <button id="resetBtn" class="btn">位置・大きさリセット</button>
  <button id="offBtn" class="btn">服を脱ぐ</button>
  <label class="small"><input type="checkbox" id="showBones"> 骨格を表示（確認用）</label>

  <h3>本物のAI試着（ライブ・Decart）</h3>
  <label class="small" style="opacity:.75">Anywearと同じAI（Lucy VTON）で、カメラ映像そのものに服を着せます。カメラ映像はDecartのサーバーに送られます。無料クレジットの範囲で使い、切れたら止めてください。</label>
  <input id="dkKey" type="password" placeholder="DecartのAPIキーを貼り付け" style="width:100%;padding:8px;border-radius:6px;border:0;background:#2c2c36;color:#fff">
  <label class="small"><input type="checkbox" id="dkSave"> キーをこの端末に保存する</label>
  <label class="small">自動停止（クレジットの使いすぎ防止）
    <select id="dkLimit"><option value="30">30秒</option><option value="60" selected>1分</option><option value="180">3分</option><option value="600">10分</option></select>
  </label>
  <button id="dkBtn" class="btn ai">AIライブ試着を開始</button>
  <div id="dkInfo" class="small" style="font-size:12px;opacity:.85;min-height:1.2em"></div>

  <h3>高画質AI（静止画・実験的）</h3>
  <button id="aiBtn" class="btn ai">今の姿をAIで試着</button>
  <label class="small" style="opacity:.7">写真と服の画像を Hugging Face の無料デモ（IDM-VTON）に送信します。混雑時は数分かかるか失敗します。</label>
</aside>

<main id="drop">
  <div id="banner">Drag a product onto yourself.</div>
  <div id="stage"><canvas id="cv"></canvas><video id="v" playsinline muted autoplay></video>
    <video id="aiLive" playsinline muted autoplay style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:2;background:#000"></video></div>
  <div id="start">
    <button id="startBtn">カメラを起動</button>
    <p>カメラ映像はこの端末の中だけで処理します。<br>（「高画質AI」ボタンを押した時だけ、その1枚を外部に送ります）</p>
  </div>
  <div id="msg" hidden></div>
  <div id="fps"></div>
  <div id="aiView"><img id="aiImg" alt="AI試着の結果"><div style="display:flex;gap:10px"><button class="btn" id="aiSave">保存</button><button class="btn" id="aiClose">閉じる</button></div></div>
</main>

<script type="module">
const LIB_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm';
const WASM_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const MODEL = n => `https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_${n}/float16/1/pose_landmarker_${n}.task`;
const GRADIO_URL = 'https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js';

// ===== 服の座標系 =====
// 服は「平置き」の画像として、論理座標 800x760（実体は2倍）で持つ。
// 体との対応（リグ）：肩の縫い目 LS/RS、腰 LH/RH、脇の下 LA/RA、袖の向き dirL/dirR
const LW = 800, LH_ = 760, GS = 2, GW = LW * GS, GH = LH_ * GS;
const BASE = { LS: { x: 260, y: 120 }, RS: { x: 540, y: 120 }, LH: { x: 300, y: 630 }, RH: { x: 500, y: 630 }, LA: { x: 272, y: 300 }, RA: { x: 528, y: 300 }, LB: { x: 278, y: 700 }, RB: { x: 522, y: 700 } };
const REST_SW = BASE.RS.x - BASE.LS.x;   // 280
const GX = 32, GY = 30;                   // 変形の格子（25×25の升目。GPUで描くので細かくできる）
const VIS = 0.5;

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const layer = document.createElement('canvas'), lctx = layer.getContext('2d');
const shadeC = document.createElement('canvas'), sctx = shadeC.getContext('2d');
const maskC = document.createElement('canvas'), mctx = maskC.getContext('2d');
const shadowC = document.createElement('canvas'), shctx = shadowC.getContext('2d');
const video = $('v'), stage = $('stage'), main = $('drop'), list = $('list');
const msg = $('msg'), sizeEl = $('size');
const FILTER_OK = 'filter' in ctx;

let landmarker = null, trackOn = false, camOn = false, lastT = -1, pose = null, hasMask = false;
let geo = { dx: 0, dy: 0, dw: 1, dh: 1 };
let item = null, offset = { x: 0, y: 0 }, sm = null, lost = 0;
let facingBack = false, backScore = 0;   // 背中を向いているか（数フレーム続いたら切り替える）
const hem = { HL: null, HR: null };

function say(t, err) { msg.hidden = !t; msg.textContent = t || ''; msg.classList.toggle('err', !!err); }
const V = {
  add: (a, b) => ({ x: a.x + b.x, y: a.y + b.y }), sub: (a, b) => ({ x: a.x - b.x, y: a.y - b.y }),
  mul: (a, k) => ({ x: a.x * k, y: a.y * k }), len: a => Math.hypot(a.x, a.y),
  norm: a => { const l = Math.hypot(a.x, a.y) || 1; return { x: a.x / l, y: a.y / l }; },
  lerp: (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }),
  rot: (a, r) => ({ x: a.x * Math.cos(r) - a.y * Math.sin(r), y: a.x * Math.sin(r) + a.y * Math.cos(r) }),
};
const smoothstep = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };

// ================================================================
//  サンプル商品（手描きではなく、布の質感・縫い目・陰影まで描き込む）
// ================================================================
const noiseTile = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), d = g.createImageData(128, 128);
  for (let i = 0; i < d.data.length; i += 4) { const v = 110 + Math.random() * 40; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
})();
function knitTile(col, dark) {
  const c = document.createElement('canvas'); c.width = 12; c.height = 14;
  const g = c.getContext('2d'); g.fillStyle = col; g.fillRect(0, 0, 12, 14);
  g.strokeStyle = dark; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(0.5, 0); g.lineTo(6, 7); g.lineTo(11.5, 0); g.moveTo(0.5, 7); g.lineTo(6, 14); g.lineTo(11.5, 7); g.stroke();
  return c;
}
function weaveTile(col, dark) {
  const c = document.createElement('canvas'); c.width = c.height = 6;
  const g = c.getContext('2d'); g.fillStyle = col; g.fillRect(0, 0, 6, 6);
  g.fillStyle = dark; g.fillRect(0, 0, 3, 3); g.fillRect(3, 3, 3, 3);
  return c;
}
// 平置きの服の輪郭（胴体＋袖）
function sleevePoly(S, dir, len, w0, w1) {
  const n = { x: -dir.y, y: dir.x }, E = V.add(S, V.mul(dir, len));
  return [V.add(S, V.mul(n, -w0 / 2)), V.add(E, V.mul(n, -w1 / 2)), V.add(E, V.mul(n, w1 / 2)), V.add(S, V.mul(n, w0 / 2))];
}
// 図形の向き（時計回り／反時計回り）を胴とそろえて描く：向きが逆だと重なった所が穴になる
const TORSO_PTS = [[330, 72], [260, 102], [252, 160], [272, 310], [285, 690], [515, 690], [528, 310], [548, 160], [540, 102], [470, 72]];
const area = pts => { let a = 0; for (let i = 0; i < pts.length; i++) { const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % pts.length]; a += x1 * y2 - x2 * y1; } return a; };
const TORSO_SIGN = Math.sign(area(TORSO_PTS));
function polyPath(g, pts) {
  const arr = pts.map(p => [p.x, p.y]);
  if (Math.sign(area(arr)) !== TORSO_SIGN) arr.reverse();
  g.moveTo(arr[0][0], arr[0][1]); for (const [x, y] of arr.slice(1)) g.lineTo(x, y); g.closePath();
}
function garmentPath(g, spec) {
  const { LS, RS } = BASE;
  const hemL = { x: 285, y: 690 }, hemR = { x: 515, y: 690 };
  g.beginPath();
  // 胴体
  g.moveTo(330, 72); g.lineTo(LS.x, LS.y - 18); g.lineTo(LS.x - 8, LS.y + 40); g.lineTo(272, 310);
  g.quadraticCurveTo(284, 500, hemL.x, hemL.y); g.lineTo(hemR.x, hemR.y);
  g.quadraticCurveTo(516, 500, 528, 310); g.lineTo(RS.x + 8, RS.y + 40); g.lineTo(RS.x, RS.y - 18); g.lineTo(470, 72);
  g.quadraticCurveTo(400, spec.back ? 92 : (spec.neckDepth || 118), 330, 72); g.closePath();
  // 袖
  const sin = spec.sleeveIn || 0;
  for (const [S, dir] of [[{ x: LS.x + 6 + sin, y: LS.y + 28 }, spec.dirL], [{ x: RS.x - 6 - sin, y: RS.y + 28 }, spec.dirR]]) {
    const p = sleevePoly(S, dir, spec.sleeveLen, 140, spec.long ? 96 : 120);
    polyPath(g, p);
    // 脇の下の切れ込みを布で埋める（胴の脇〜袖の内側）
    const sd = S.x < 400 ? -1 : 1;
    const inner = Math.abs(p[0].x - 400) < Math.abs(p[3].x - 400) ? p[0] : p[3], outer = inner === p[0] ? p[3] : p[0];
    const yb = 345, q = V.add(inner, V.mul(dir, (yb - inner.y) / dir.y));
    polyPath(g, [{ x: 400 + sd * 142, y: 108 }, { x: 400 + sd * 126, y: yb }, q, outer]);
  }
}
function makeSample(spec) {
  const c = document.createElement('canvas'); c.width = GW; c.height = GH;
  const g = c.getContext('2d'); g.scale(GS, GS);
  const { LS, RS } = BASE;
  const back = !!spec.back;
  // フード（体の後ろ）
  if (spec.type === 'hoodie' && !back) {
    g.fillStyle = shade(spec.color, -18); g.beginPath(); g.ellipse(400, 70, 120, 64, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = shade(spec.color, -40); g.beginPath(); g.ellipse(400, 78, 82, 40, 0, 0, Math.PI * 2); g.fill();
  }
  garmentPath(g, spec);
  g.save(); g.clip();
  // 地の色と生地の質感
  g.fillStyle = spec.color; g.fillRect(0, 0, LW, LH_);
  if (spec.texture === 'knit') { g.globalAlpha = .55; g.fillStyle = g.createPattern(knitTile(spec.color, shade(spec.color, -22)), 'repeat'); g.fillRect(0, 0, LW, LH_); g.globalAlpha = 1; }
  if (spec.texture === 'weave') { g.globalAlpha = .35; g.fillStyle = g.createPattern(weaveTile(spec.color, shade(spec.color, -14)), 'repeat'); g.fillRect(0, 0, LW, LH_); g.globalAlpha = 1; }
  g.globalCompositeOperation = 'overlay'; g.globalAlpha = spec.texture === 'fleece' ? .5 : .28;
  g.fillStyle = g.createPattern(noiseTile, 'repeat'); g.fillRect(0, 0, LW, LH_);
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;

  // 柄：セーターの白い曲線（胴と袖）
  if (spec.type === 'sweater') {
    g.strokeStyle = 'rgba(255,255,255,.92)'; g.lineWidth = 11; g.lineCap = 'round';
    for (let k = 0; k < 4; k++) {
      g.beginPath();
      for (let x = 60; x <= 740; x += 6) {
        const y = 230 + k * 105 + Math.sin((x + k * 55) / 30) * 24 + Math.sin(x / 11) * 2;
        x === 60 ? g.moveTo(x, y) : g.lineTo(x, y);
      }
      g.stroke();
    }
    g.globalAlpha = .45; g.fillStyle = g.createPattern(knitTile('rgba(0,0,0,0)', 'rgba(0,0,0,.35)'), 'repeat'); g.fillRect(0, 0, LW, LH_); g.globalAlpha = 1;
  }
  // 陰影（光は左上から。脇・袖の内側・裾にかけて落とす）
  const lg = g.createLinearGradient(0, 0, LW, LH_);
  lg.addColorStop(0, 'rgba(255,255,255,.14)'); lg.addColorStop(.5, 'rgba(0,0,0,0)'); lg.addColorStop(1, 'rgba(0,0,0,.22)');
  g.fillStyle = lg; g.fillRect(0, 0, LW, LH_);
  const side = g.createLinearGradient(272, 0, 528, 0);
  side.addColorStop(0, 'rgba(0,0,0,.26)'); side.addColorStop(.18, 'rgba(0,0,0,0)'); side.addColorStop(.82, 'rgba(0,0,0,0)'); side.addColorStop(1, 'rgba(0,0,0,.26)');
  g.fillStyle = side; g.fillRect(260, 280, 280, 420);
  // シワ（明暗のペアで立体感を出す）
  const fold = (pts, w) => {
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.strokeStyle = 'rgba(0,0,0,.20)'; g.lineWidth = w; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.10)'; g.lineWidth = w * .6; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0] + w * .7, p[1] - w * .3) : g.moveTo(p[0] + w * .7, p[1] - w * .3)); g.stroke();
  };
  // 縫い目（ステッチ）
  g.setLineDash([5, 4]); g.lineWidth = 1.8; g.strokeStyle = 'rgba(0,0,0,.35)';
  const line = pts => { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)); g.stroke(); };
  line([{ x: 330, y: 76 }, { x: LS.x + 4, y: LS.y - 12 }]); line([{ x: 470, y: 76 }, { x: RS.x - 4, y: RS.y - 12 }]);
  g.beginPath(); g.moveTo(LS.x + 2, LS.y - 14); g.quadraticCurveTo(LS.x + 22, LS.y + 100, 276, 306); g.stroke();
  g.beginPath(); g.moveTo(RS.x - 2, RS.y - 14); g.quadraticCurveTo(RS.x - 22, RS.y + 100, 524, 306); g.stroke();
  g.setLineDash([]);
  // 裾と袖口のリブ（縦の細い線）
  const rib = (pts, h) => {
    g.save(); g.fillStyle = shade(spec.color, -10);
    g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)); g.closePath(); g.fill();
    g.clip(); g.strokeStyle = 'rgba(0,0,0,.22)'; g.lineWidth = 1.4;
    for (let x = 0; x < LW; x += 5) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x + h * 0.0, LH_); g.stroke(); }
    g.restore();
  };
  if (spec.rib) {
    rib([{ x: 285, y: 650 }, { x: 515, y: 650 }, { x: 515, y: 692 }, { x: 285, y: 692 }]);
    if (spec.long) for (const [S, dir] of [[{ x: LS.x + 6, y: LS.y + 28 }, spec.dirL], [{ x: RS.x - 6, y: RS.y + 28 }, spec.dirR]]) {
      const n = { x: -dir.y, y: dir.x }, E = V.add(S, V.mul(dir, spec.sleeveLen)), E0 = V.add(S, V.mul(dir, spec.sleeveLen - 40));
      rib([V.add(E0, V.mul(n, -45)), V.add(E, V.mul(n, -44)), V.add(E, V.mul(n, 44)), V.add(E0, V.mul(n, 45))]);
    }
  }
  // 種類ごとの細部（前側だけ）
  if (spec.type === 'hoodie' && !back) {
    g.fillStyle = shade(spec.color, 6); g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(300, 450); g.lineTo(500, 450); g.lineTo(530, 600); g.lineTo(270, 600); g.closePath(); g.fill();
    g.setLineDash([4, 4]); g.stroke(); g.setLineDash([]);
    g.strokeStyle = 'rgba(0,0,0,.4)'; g.beginPath(); g.moveTo(300, 450); g.lineTo(280, 595); g.moveTo(500, 450); g.lineTo(520, 595); g.stroke();
  }
  if (spec.type === 'shirt' && back) {   // 背中：ヨーク（肩の切り替え）とセンターのタック
    g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = 1.6; g.setLineDash([4, 3]);
    g.beginPath(); g.moveTo(268, 200); g.quadraticCurveTo(400, 214, 532, 200); g.stroke(); g.setLineDash([]);
    g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 3; g.beginPath(); g.moveTo(400, 206); g.lineTo(400, 300); g.stroke();
  }
  if (spec.type === 'shirt' && !back) {
    g.fillStyle = shade(spec.color, 4); g.fillRect(388, 110, 24, 590);
    g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 1.5; g.strokeRect(388, 110, 24, 590);
    for (let y = 170; y <= 650; y += 80) {
      g.fillStyle = '#f7f7f7'; g.beginPath(); g.arc(400, y, 7, 0, Math.PI * 2); g.fill();
      g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 1; g.stroke();

  } catch (err) {
    say('AI試着に失敗しました（無料枠の上限・混雑・サーバー停止の可能性）：' + (err && err.message ? err.message : err), true);
  } finally { btn.disabled = false; }
};
$('aiClose').onclick = () => { $('aiView').style.display = 'none'; };
$('aiSave').onclick = () => { if (!aiUrl) return; const a = document.createElement('a'); a.href = aiUrl; a.download = 'ai-tryon.png'; a.target = '_blank'; a.click(); };

// ================================================================
//  本物のAI試着（ライブ）：Decart の Lucy VTON に接続する
//  ※ 個人のPC内で使う前提で、APIキーをブラウザから直接使う（公開サイトには置かないこと）
// ================================================================
const DK_SDK = ['https://esm.sh/@decartai/sdk', 'https://cdn.jsdelivr.net/npm/@decartai/sdk/+esm'];
const DK_RATE = 0.02;   // 1秒あたりの料金の目安（USD、標準モード）
const dk = { rt: null, stream: null, t0: 0, timer: null, busy: false };
function dkActive() { return !!dk.rt; }
try { const k = localStorage.getItem('dkKey'); if (k) { $('dkKey').value = k; $('dkSave').checked = true; } } catch (e) {}
function dkInfo(t, err) { $('dkInfo').textContent = t; $('dkInfo').style.color = err ? '#ff8a9a' : ''; }
async function dkLoadSdk() {
  let last;
  for (const u of DK_SDK) { try { return await import(u); } catch (e) { last = e; } }
  throw new Error('SDKを読み込めませんでした（通信を確認）：' + (last && last.message));
}
// AIに渡す服の画像：取り込んだ写真は元のファイル、サンプルは白背景に置いた画像
async function dkGarment(it) {
  if (it.srcFile) return it.srcFile;
  const c = document.createElement('canvas'); c.width = 768; c.height = 1024;
  const g = c.getContext('2d'); g.fillStyle = '#f4f4f6'; g.fillRect(0, 0, 768, 1024);
  const t = it.thumb, k = Math.min(768 / t.width, 1024 / t.height); g.drawImage(t, (768 - t.width * k) / 2, (1024 - t.height * k) / 2, t.width * k, t.height * k);
  return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
}
const dkPrompt = it => `The person is wearing a ${it.desc || 'shirt'}, fitted naturally to their upper body with realistic fabric texture, folds, drape and lighting, sleeves following the arms.`;
async function dkApply() {
  if (!dk.rt || !item) return;
  try {
    dkInfo('服を着せています…');
    await dk.rt.set({ prompt: dkPrompt(item), image: await dkGarment(item), enhance: false });
    dkInfo('');
  } catch (e) { dkInfo('服の切り替えに失敗：' + (e && e.message ? e.message : e), true); }
}
window.dkApply = dkApply;
async function dkStop(reason) {
  clearInterval(dk.timer); dk.timer = null;
  try { if (dk.rt) dk.rt.disconnect(); } catch (e) {}
  dk.rt = null;
  if (dk.stream) { dk.stream.getTracks().forEach(t => t.stop()); dk.stream = null; }
  $('aiLive').style.display = 'none'; $('aiLive').srcObject = null;
  $('dkBtn').textContent = 'AIライブ試着を開始';
  const used = dk.t0 ? Math.round((performance.now() - dk.t0) / 1000) : 0; dk.t0 = 0;
  dkInfo(`${reason || '停止しました'}（今回の使用：約${used}秒・目安 $${(used * DK_RATE).toFixed(2)}）`);
}
async function dkStart() {
  const key = $('dkKey').value.trim();
  if (!key) { dkInfo('先にDecartのAPIキーを貼り付けてください（platform.decart.ai で無料登録）', true); return; }
  if (!item) { dkInfo('先に左の一覧から服を選んでください', true); return; }
  try { if ($('dkSave').checked) localStorage.setItem('dkKey', key); else localStorage.removeItem('dkKey'); } catch (e) {}
  dk.busy = true; $('dkBtn').disabled = true; dkInfo('AIに接続しています…');
  try {
    const { createDecartClient, models } = await dkLoadSdk();
    const model = models.realtime('lucy-vton-latest');
    dk.stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: 'user', frameRate: model.fps, width: model.width, height: model.height },
    });
    const client = createDecartClient({ apiKey: key });
    const live = $('aiLive');
    dk.rt = await client.realtime.connect(dk.stream, {
      model, mirror: 'auto',
      onRemoteStream: st => { live.srcObject = st; live.style.display = 'block'; live.play().catch(() => {}); },
      initialState: { prompt: dkPrompt(item), image: await dkGarment(item), enhance: false },
    });
    if (dk.rt.on) {
      dk.rt.on('error', e => dkInfo('AIでエラー：' + (e && e.message ? e.message : e), true));
      dk.rt.on('connectionChange', st => { if (st === 'disconnected' && dk.rt) dkStop('接続が切れました'); });
    }
    dk.t0 = performance.now();
    $('dkBtn').textContent = 'AIライブ試着を止める';
    const limit = +$('dkLimit').value;
    dk.timer = setInterval(() => {
      const sec = Math.round((performance.now() - dk.t0) / 1000);
      dkInfo(`AIライブ中：${sec}秒 / 自動停止 ${limit}秒（目安 $${(sec * DK_RATE).toFixed(2)}）。左の服を選ぶと着替えます`);
      if (sec >= limit) dkStop('自動停止しました');
    }, 1000);
  } catch (e) {
    await dkStop('');
    const m = e && e.message ? e.message : String(e);
    dkInfo('AIに接続できませんでした：' + m + (/401|403|auth|key/i.test(m) ? '（APIキーを確認）' : /credit|quota|402|payment/i.test(m) ? '（無料クレジットが残っていない可能性。ここで止めてください）' : ''), true);
  } finally { dk.busy = false; $('dkBtn').disabled = false; }
}
$('dkBtn').onclick = () => { if (dk.busy) return; dk.rt ? dkStop() : dkStart(); };
// タブを離れたら止める（気付かないうちにクレジットを使わないように）
document.addEventListener('visibilitychange', () => { if (document.hidden && dk.rt) dkStop('画面を離れたので停止しました'); });
window.addEventListener('beforeunload', () => { if (dk.rt) dkStop(); });

// 確認用（URLの末尾に #debug を付けた時だけ）：骨格を手で与えて変形を確かめる
if (location.hash === '#debug') window.__debug = { setBody: b => { sm = b; }, select, items, GL, noGL: v => { GL.off = v; }, setBack: v => { facingBack = v; } };
requestAnimationFrame(loop);
</script>
