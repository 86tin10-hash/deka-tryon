<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JUST U NEED デカプリ</title>
<style>
  :root { --ink:#1A1A1A; --cream:#EFE6D6; --red:#E5262B; --yellow:#F2B531; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#111; color:#fff; font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .screen { display:none; height:100%; }
  .screen.active { display:flex; }
  button { font:inherit; cursor:pointer; border:none; border-radius:999px; padding:14px 26px; font-weight:700; font-size:18px; }
  button:disabled { opacity:.4; cursor:default; }
  .primary { background:var(--yellow); color:var(--ink); }
  .ghost { background:#2a2a2a; color:#fff; }
  .chip { background:#2a2a2a; color:#fff; padding:10px 18px; font-size:15px; }
  .chip.on { background:#fff; color:var(--ink); }
  #setup { flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:24px; text-align:center; }
  #setup h1 { font-family: Impact, "Arial Black", sans-serif; font-size:56px; letter-spacing:2px; margin:0; }
  #setup p { margin:0; color:#bbb; }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; }
  input[type=text] { font:inherit; font-size:20px; padding:12px 16px; border-radius:12px; border:none; width:min(420px,90vw); text-align:center; }
  label.small { color:#bbb; font-size:14px; }
  #shoot { position:relative; align-items:center; justify-content:center; background:#000; }
  #video { width:100%; height:100%; object-fit:contain; transform:scaleX(-1); }
  #video.nomirror { transform:none; }
  #guide { position:absolute; aspect-ratio:4/3; height:min(90vh, calc(90vw*0.75)); border:3px dashed rgba(255,255,255,.55); border-radius:20px; pointer-events:none; }
  #count { position:absolute; font-size:200px; font-weight:900; text-shadow:0 0 30px rgba(0,0,0,.6); pointer-events:none; }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .35s; }
  #shotInfo { position:absolute; top:18px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.55); padding:8px 18px; border-radius:999px; font-weight:700; }
  #shootBar { position:absolute; bottom:22px; display:flex; gap:12px; }
  #pick { flex-direction:column; align-items:center; justify-content:flex-start; gap:14px; padding:20px; overflow:auto; }
  #pick h2 { margin:0; font-size:22px; }
  #grid { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; width:min(900px,100%); }
  .cell { position:relative; border:3px solid transparent; border-radius:10px; overflow:hidden; background:#222; padding:0; }
  .cell img { width:100%; display:block; }
  .cell .badge { position:absolute; top:6px; left:6px; min-width:34px; height:34px; padding:0 8px; border-radius:17px; background:var(--yellow); color:var(--ink); font-weight:900; display:none; align-items:center; justify-content:center; }
  .cell.sel { border-color:var(--yellow); }
  .cell.sel .badge { display:flex; }
  .cell.dim img { opacity:.55; }
  #layout { gap:14px; align-items:flex-start; }
  .lp { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .lsheet { position:relative; width:84px; height:119px; background:#fff; border-radius:4px; overflow:hidden; }
  .lsheet.cut { border-bottom:2px dashed #E5262B; }
  .lstrip { position:absolute; left:50%; transform:translateX(-50%); width:50px; height:200px; border-radius:4px; display:flex; flex-direction:column; gap:3px; padding:4px; box-sizing:border-box; }
  .lstrip.full { top:8px; height:104px; }
  .lstrip.top { top:6px; }
  .lstrip.bottom { top:-100px; }
  .lstrip i { flex:1; background:#777; border-radius:2px; opacity:.6; }
  .llabel { font-size:12px; color:#bbb; text-align:center; }
  #review { flex-direction:row; gap:24px; padding:20px; align-items:center; justify-content:center; }
  #preview { height:calc(100vh - 40px); max-width:40vw; object-fit:contain; background:#222; border-radius:6px; }
  #panel { display:flex; flex-direction:column; gap:16px; max-width:420px; }
  #panel h2 { margin:0; font-size:22px; }
  .msg { color:#bbb; font-size:14px; min-height:1.2em; }
  @media (max-width: 760px) { #review { flex-direction:column; overflow:auto; } #preview { max-width:80vw; height:auto; max-height:60vh; } #grid { grid-template-columns:repeat(2, minmax(0,1fr)); } }
  #printArea { display:none; }
  .page { position:relative; width:210mm; height:297mm; overflow:hidden; page-break-after:always; break-after:page; }
  .page:last-child { page-break-after:auto; break-after:auto; }
  .tileBox { position:absolute; overflow:hidden; }
  .tileBox img { position:absolute; left:0; }
  .tileLabel { position:absolute; bottom:2mm; right:4mm; font:8pt sans-serif; color:#999; }
  @media print {
    body { background:#fff; }
    .screen { display:none !important; }
    #printArea { display:block; }
    #printArea img { display:block; }
  }
</style>
<style id="pageStyle"></style>
</head>
<body>

<section id="setup" class="screen active">
  <h1>JUST U NEED<br>DEKA PURI</h1>
  <p>縦長デカプリ ／ 6枚撮影 → 好きな4枚を選んで1枚の台紙に</p>
  <div>
    <label class="small">真ん中の文字</label><br>
    <input type="text" id="bandText" value="I ♥ NAGASAKI" maxlength="24">
  </div>
  <div>
    <label class="small">カメラ</label>
    <div class="row" id="camChips">
      <button class="chip on" data-cam="user">前のカメラ</button>
      <button class="chip" data-cam="environment">後ろのカメラ</button>
    </div>
  </div>
  <div class="row">
    <button class="primary" id="btnStart">撮影へ進む</button>
  </div>
  <p class="msg" id="setupMsg"></p>
  <input type="file" id="fileInput" accept="image/*" capture="user" hidden>
</section>

<section id="shoot" class="screen">
  <video id="video" autoplay playsinline muted></video>
  <div id="guide"></div>
  <div id="shotInfo">1 / 6</div>
  <div id="count"></div>
  <div id="flash"></div>
  <div id="shootBar">
    <button class="ghost" id="btnBack">戻る</button>
    <button class="primary" id="btnShoot">撮影スタート（5秒×6枚）</button>
  </div>
</section>

<section id="pick" class="screen">
  <h2>4枚を選ぶ</h2>
  <p class="msg">選んだ順に上から並びます。同じ写真を何度でも選べます。</p>
  <div id="grid"></div>
  <div class="row">
    <button class="ghost" id="btnPickUndo">1つ戻す</button>
    <button class="ghost" id="btnPickReset">選び直す</button>
    <button class="primary" id="btnPickDone" disabled>この4枚で仕上げる</button>
  </div>
  <p class="msg" id="pickMsg"></p>
</section>

<section id="review" class="screen">
  <img id="preview" alt="デカプリのプレビュー">
  <div id="panel">
    <h2>できあがり</h2>
    <div>
      <label class="small">フィルター</label>
      <div class="row" id="filterChips">
        <button class="chip on" data-filter="none">そのまま</button>
        <button class="chip" data-filter="bright">明るめ</button>
        <button class="chip" data-filter="film">フィルム</button>
        <button class="chip" data-filter="mono">モノクロ</button>
      </div>
    </div>
    <div>
      <label class="small">台紙の色</label>
      <div class="row" id="colorChips2">
        <button class="chip" data-color="white">ホワイト</button>
        <button class="chip" data-color="black">ブラック</button>
        <button class="chip" data-color="yellow">イエロー</button>
        <button class="chip" data-color="red">レッド</button>
      </div>
    </div>
    <div>
      <label class="small">印刷する紙</label>
      <div class="row" id="paperChips">
        <button class="chip on" data-paper="A4-tile">ドデカ（A4×2枚つなぎ・約57cm）</button>
        <button class="chip" data-paper="A4-2">A4・2本（友達と分ける）</button>
        <button class="chip" data-paper="A4-1">A4・1本</button>
      </div>
      <div id="layout" class="row" style="margin-top:10px"></div>
    </div>
    <div>
      <label class="small">人数（人数ぶん印刷します・1人から）</label>
      <div class="row" style="justify-content:flex-start;align-items:center">
        <button class="ghost" id="btnMinus" style="padding:8px 18px">－</button>
        <span id="copiesNum" style="font-size:24px;font-weight:700;min-width:40px;text-align:center">1</span>
        <button class="ghost" id="btnPlus" style="padding:8px 18px">＋</button>
      </div>
    </div>
    <div class="row" style="justify-content:flex-start">
      <button class="primary" id="btnPrint">印刷する</button>
      <button class="ghost" id="btnSave">画像を保存</button>
    </div>
    <div class="row" style="justify-content:flex-start">
      <button class="ghost" id="btnPickAgain">選び直す</button>
      <button class="ghost" id="btnRetake">撮り直す</button>
      <button class="ghost" id="btnNew">最初から</button>
    </div>
    <p class="msg" id="reviewMsg"></p>
    <p class="msg">印刷のときは「拡大・縮小なし（100%）」で。ドデカは2枚目を1枚目の下に貼ってつなげます。</p>
  </div>
</section>

<div id="printArea"></div>
<canvas id="work" hidden></canvas>

<script>
(() => {
  const W = 1200, M = 60, PW = 1080, PH = 810, TOP = 60, GAP = 36, BAND = 220, BOTTOM = 300, R = 24;
  const Y = [TOP, TOP + PH + GAP];
  Y.push(Y[1] + PH + BAND);
  Y.push(Y[2] + PH + GAP);
  const H = Y[3] + PH + BOTTOM;
  const TAKE = 6, USE = 4, COUNTDOWN = 5;

  const COLORS = {
    white:  { bg:'#FFFFFF', ink:'#1A1A1A', sub:'#666' },
    black:  { bg:'#1A1A1A', ink:'#FFFFFF', sub:'#aaa' },
    yellow: { bg:'#F2B531', ink:'#1A1A1A', sub:'#4a3a10' },
    red:    { bg:'#E5262B', ink:'#FFFFFF', sub:'#ffd9d9' },
  };
  const PAPERS = {
    'A4-tile': { size:'A4', w:210, h:297, n:1, tile:true },
    'A4-2': { size:'A4', w:210, h:297, n:2 },
    'A4-1': { size:'A4', w:210, h:297, n:1 },
  };

  const state = { color:'white', cam:'user', filter:'none', paper:'A4-tile', copies:1, shots:[], picked:[], final:null, stream:null, busy:false, useFile:false };
  const $ = id => document.getElementById(id);
  const video = $('video');

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  }
  function chipGroup(groupId, key, onChange) {
    $(groupId).addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      [...$(groupId).children].forEach(c => c.classList.toggle('on', c === b));
      state[key] = b.dataset[key];
      onChange && onChange();
    });
  }
  function syncChips(groupId, key) {
    [...$(groupId).children].forEach(c => c.classList.toggle('on', c.dataset[key] === state[key]));
  }
  chipGroup('camChips', 'cam');
  chipGroup('colorChips2', 'color', render);
  chipGroup('filterChips', 'filter', render);
  chipGroup('paperChips', 'paper', () => drawLayout());

  function setCopies(n) {
    state.copies = Math.max(1, Math.min(99, n));
    $('copiesNum').textContent = state.copies;
    drawLayout();
  }
  $('btnPlus').addEventListener('click', () => setCopies(state.copies + 1));
  $('btnMinus').addEventListener('click', () => setCopies(state.copies - 1));

  async function startCamera() {
    stopCamera();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nocam');
    state.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: state.cam, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false
    });
    video.srcObject = state.stream;
    video.classList.toggle('nomirror', state.cam !== 'user');
    await video.play();
  }
  function stopCamera() {
    if (state.stream) { state.stream.getTracks().forEach(t => t.stop()); state.stream = null; }
  }

  function cropTo43(src, sw, sh, mirror) {
    const c = document.createElement('canvas');
    c.width = PW; c.height = PH;
    const ctx = c.getContext('2d');
    const target = 4 / 3;
    let cw = sw, ch = sw / target;
    if (ch > sh) { ch = sh; cw = sh * target; }
    const sx = (sw - cw) / 2, sy = (sh - ch) / 2;
    if (mirror) { ctx.translate(PW, 0); ctx.scale(-1, 1); }
    ctx.drawImage(src, sx, sy, cw, ch, 0, 0, PW, PH);
    return c;
  }

  function updateInfo() { $('shotInfo').textContent = `${Math.min(state.shots.length + 1, TAKE)} / ${TAKE}`; }

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function runSequence() {
    if (state.busy) return;
    state.busy = true;
    $('btnShoot').disabled = true; $('btnBack').disabled = true;
    while (state.shots.length < TAKE) {
      updateInfo();
      for (let i = COUNTDOWN; i > 0; i--) { $('count').textContent = i; await sleep(1000); }
      $('count').textContent = '';
      const shot = cropTo43(video, video.videoWidth, video.videoHeight, state.cam === 'user');
      state.shots.push(shot);
      $('flash').style.opacity = 1; await sleep(120); $('flash').style.opacity = 0;
      await sleep(1500);
    }
    state.busy = false;
    $('btnShoot').disabled = false; $('btnBack').disabled = false;
    stopCamera();
    startPick();
  }

  function askFile() {
    $('setupMsg').textContent = `カメラを直接使えないため、端末のカメラで1枚ずつ撮ります（${state.shots.length + 1} / ${TAKE}）`;
    $('fileInput').setAttribute('capture', state.cam);
    $('btnStart').textContent = `写真を撮る（${state.shots.length + 1} / ${TAKE}）`;
  }
  $('fileInput').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    const img = new Image();
    img.src = URL.createObjectURL(f);
    await img.decode();
    state.shots.push(cropTo43(img, img.naturalWidth, img.naturalHeight, false));
    URL.revokeObjectURL(img.src);
    if (state.shots.length >= TAKE) { $('btnStart').textContent = '撮影へ進む'; $('setupMsg').textContent = ''; startPick(); }
    else askFile();
  });

  $('btnStart').addEventListener('click', async () => {
    if (state.useFile) { $('fileInput').click(); return; }
    state.shots = []; state.picked = []; state.final = null;
    try {
      await startCamera();
      show('shoot'); updateInfo();
    } catch (err) {
      state.useFile = true; state.shots = [];
      askFile();
    }
  });
  $('btnBack').addEventListener('click', () => { stopCamera(); show('setup'); });
  $('btnShoot').addEventListener('click', runSequence);
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && $('shoot').classList.contains('active')) { e.preventDefault(); runSequence(); }
  });

  function startPick() {
    state.picked = []; state.final = null;
    const grid = $('grid'); grid.innerHTML = '';
    state.shots.forEach((s, i) => {
      const b = document.createElement('button');
      b.className = 'cell';
      const img = new Image();
      img.src = s.toDataURL('image/jpeg', 0.8);
      const badge = document.createElement('span');
      badge.className = 'badge';
      b.append(img, badge);
      b.addEventListener('click', () => addPick(i));
      grid.appendChild(b);
    });
    refreshPick();
    show('pick');
  }
  function addPick(i) {
    if (state.picked.length < USE) state.picked.push(i);
    refreshPick();
  }
  function refreshPick() {
    [...$('grid').children].forEach((b, i) => {
      const orders = state.picked.map((v, j) => (v === i ? j + 1 : 0)).filter(x => x > 0);
      b.classList.toggle('sel', orders.length > 0);
      b.classList.toggle('dim', state.picked.length === USE && orders.length === 0);
      b.querySelector('.badge').textContent = orders.join('·');
    });
    $('btnPickDone').disabled = state.picked.length !== USE;
    $('pickMsg').textContent = `${state.picked.length} / ${USE} 枚選択`;
  }
  $('btnPickUndo').addEventListener('click', () => { state.picked.pop(); refreshPick(); });
  $('btnPickReset').addEventListener('click', () => { state.picked = []; refreshPick(); });
  $('btnPickDone').addEventListener('click', () => {
    state.final = state.picked.map(i => state.shots[i]);
    finish();
  });

  function filtered(src) {
    if (state.filter === 'none') return src;
    const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
    const ctx = c.getContext('2d'); ctx.drawImage(src, 0, 0);
    const d = ctx.getImageData(0, 0, c.width, c.height), p = d.data;
    for (let i = 0; i < p.length; i += 4) {
      let r = p[i], g = p[i+1], b = p[i+2];
      if (state.filter === 'mono') {
        let y = 0.299*r + 0.587*g + 0.114*b;
        y = (y - 128) * 1.12 + 128;
        r = g = b = y;
      } else if (state.filter === 'film') {
        r = r*0.95 + 18; g = g*0.92 + 12; b = b*0.82 + 10;
        r = (r - 128) * 0.95 + 128; g = (g - 128) * 0.95 + 128; b = (b - 128) * 0.95 + 128;
      } else if (state.filter === 'bright') {
        r = r*1.08 + 12; g = g*1.08 + 12; b = b*1.06 + 14;
        r = (r - 128) * 0.94 + 128; g = (g - 128) * 0.94 + 128; b = (b - 128) * 0.94 + 128;
      }
      p[i] = r; p[i+1] = g; p[i+2] = b;
    }
    ctx.putImageData(d, 0, 0);
    return c;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function fitText(ctx, text, maxW, size, weight, family) {
    let s = size;
    do { ctx.font = `${weight} ${s}px ${family}`; s -= 4; } while (ctx.measureText(text).width > maxW && s > 20);
  }
  function render() {
    if (!state.final) return;
    const c = $('work'); c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    const col = COLORS[state.color];
    ctx.fillStyle = col.bg; ctx.fillRect(0, 0, W, H);
    state.final.forEach((s, i) => {
      ctx.save(); roundRect(ctx, M, Y[i], PW, PH, R); ctx.clip();
      ctx.drawImage(filtered(s), M, Y[i], PW, PH); ctx.restore();
    });
    const display = 'Impact, "Arial Black", "Hiragino Sans", sans-serif';
    const band = ($('bandText').value || '').trim();
    if (band) {
      ctx.fillStyle = col.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      fitText(ctx, band, PW - 40, 130, '900', display);
      ctx.fillText(band, W / 2, Y[1] + PH + BAND / 2 + 4);
    }
    ctx.fillStyle = col.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    fitText(ctx, 'JUST U NEED', PW, 150, '900', display);
    ctx.fillText('JUST U NEED', W / 2, Y[3] + PH + 175);
    const d = new Date();
    const date = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    ctx.fillStyle = col.sub; ctx.font = `700 40px system-ui, sans-serif`;
    ctx.fillText(`${date}   @justuneed_japan`, W / 2, Y[3] + PH + 250);
    $('preview').src = c.toDataURL('image/jpeg', 0.92);
    drawLayout();
  }

  function drawLayout() {
    const p = PAPERS[state.paper];
    const bg = COLORS[state.color].bg;
    const page = (inner, label, cls) => `<div class="lp"><div class="lsheet ${cls || ''}">${inner}</div><div class="llabel">${label}</div></div>`;
    const strip = (pos) => `<div class="lstrip ${pos}" style="background:${bg}"><i></i><i></i><i></i><i></i></div>`;
    let html;
    if (p.tile) {
      html = page(strip('top'), '1枚目（上）', 'cut') + page(strip('bottom'), '2枚目（下）');
    } else {
      html = Array.from({ length: p.n }, (_, k) => page(strip('full'), p.n > 1 ? `${k + 1}本目` : '1本')).join('');
    }
    html += `<div class="llabel" style="width:100%">${state.copies}人分（${state.copies}部）印刷します</div>`;
    $('layout').innerHTML = html;
  }

  function finish() {
    syncChips('colorChips2', 'color');
    render();
    $('reviewMsg').textContent = '';
    show('review');
  }

  $('btnSave').addEventListener('click', () => {
    const c = $('work');
    c.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `JUN-dekapuri-${Date.now()}.jpg`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      $('reviewMsg').textContent = '保存できない端末では、プレビュー画像を長押しして保存してください。';
    }, 'image/jpeg', 0.95);
  });

  $('btnPrint').addEventListener('click', () => {
    const p = PAPERS[state.paper];
    const margin = 6;
    const src = $('work').toDataURL('image/jpeg', 0.95);
    const area = $('printArea');
    area.innerHTML = '';
    $('pageStyle').textContent = `@page { size: ${p.size} portrait; margin: 0; }`;
    const pages = [];
    for (let c = 0; c < state.copies; c++) {
      if (p.tile) {
        const half = p.h - margin * 2;
        let stripH = half * 2, stripW = stripH * W / H;
        if (stripW > p.w - margin * 2) { stripW = p.w - margin * 2; stripH = stripW * H / W; }
        const boxH = stripH / 2;
        for (let i = 0; i < 2; i++) {
          const page = document.createElement('div'); page.className = 'page';
          const box = document.createElement('div'); box.className = 'tileBox';
          box.style.left = ((p.w - stripW) / 2) + 'mm'; box.style.top = margin + 'mm';
          box.style.width = stripW + 'mm'; box.style.height = boxH + 'mm';
          const img = new Image(); img.src = src;
          img.style.width = stripW + 'mm'; img.style.height = stripH + 'mm';
          img.style.top = (i === 0 ? 0 : -boxH) + 'mm';
          box.appendChild(img); page.appendChild(box);
          const lbl = document.createElement('div'); lbl.className = 'tileLabel';
          lbl.textContent = (i === 0 ? '1枚目（上）' : '2枚目（下）') + (state.copies > 1 ? `・${c + 1}人目` : '');
          page.appendChild(lbl);
          pages.push(page);
        }
      } else {
        const page = document.createElement('div'); page.className = 'page';
        Object.assign(page.style, { display:'flex', justifyContent:'center', alignItems:'center', gap:'6mm' });
        let stripH = p.h - margin * 2;
        let stripW = stripH * W / H;
        const maxW = (p.w - margin * 2 - (p.n - 1) * 6) / p.n;
        if (stripW > maxW) { stripW = maxW; stripH = stripW * H / W; }
        for (let i = 0; i < p.n; i++) {
          const img = new Image(); img.src = src;
          img.style.width = stripW + 'mm'; img.style.height = stripH + 'mm';
          if (state.color === 'white') img.style.outline = '0.2mm dashed #ccc';
          page.appendChild(img);
        }
        pages.push(page);
      }
    }
    pages.forEach(pg => area.appendChild(pg));
    setTimeout(() => {
      try { window.print(); }
      catch (e) { $('reviewMsg').textContent = 'この画面では印刷できません。画像を保存して印刷してください。'; }
    }, 300);
  });

  const CONFIRM_MSG = '撮影した写真データは消えます。よろしいですか？';

  $('btnPickAgain').addEventListener('click', () => startPick());

  $('btnRetake').addEventListener('click', async () => {
    if (!window.confirm(CONFIRM_MSG)) return;
    state.shots = []; state.picked = []; state.final = null;
    if (state.useFile) { show('setup'); askFile(); return; }
    try { await startCamera(); show('shoot'); updateInfo(); } catch (e) { show('setup'); }
  });
  $('btnNew').addEventListener('click', () => {
    if (!window.confirm(CONFIRM_MSG)) return;
    state.shots = []; state.picked = []; state.final = null; state.useFile = false;
    $('btnStart').textContent = '撮影へ進む'; $('setupMsg').textContent = '';
    state.color = 'white'; syncChips('colorChips2', 'color');
    setCopies(1);
    show('setup');
  });
})();
</script>
</body>
</html>
